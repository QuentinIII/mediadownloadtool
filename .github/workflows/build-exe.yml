name: Build portable exe

on:
  push:
    tags: ["v*"]          # git tag v1.0.0 && git push --tags  -> Release publiée
  workflow_dispatch:      # bouton "Run workflow"
    inputs:
      version:
        description: "Version à publier en Release (ex: 1.0.0). Vide = exe en artefact seulement"
        required: false
        default: ""

permissions:
  contents: write

env:
  VERSION: ${{ github.event_name == 'push' && github.ref_name || (inputs.version != '' && format('v{0}', inputs.version) || '') }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (latest yt-dlp)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -U -r requirements.txt pyinstaller

      - name: Set version from tag
        if: env.VERSION != ''
        shell: python
        run: |
          import os, re
          v = os.environ["VERSION"].lstrip("v")
          p = "mediadownloadtool.py"
          s = open(p, encoding="utf-8").read()
          s = re.sub(r'APP_VERSION = "[^"]*"', f'APP_VERSION = "{v}"', s, count=1)
          open(p, "w", encoding="utf-8").write(s)

      - name: Build
        run: python build.py

      - name: Self-test the exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\mediadownloadtool.exe -ArgumentList '--selftest','selftest.json' -Wait -PassThru
          Get-Content selftest.json
          if ($p.ExitCode -ne 0) { throw "Selftest failed (exit $($p.ExitCode))" }

      - name: Rename
        shell: pwsh
        run: |
          $name = if ($env:VERSION) { "mediadownloadtool-$env:VERSION-windows-x64.exe" } else { "mediadownloadtool-windows-x64.exe" }
          Move-Item dist\mediadownloadtool.exe "dist\$name"
          "EXE_NAME=$name" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXE_NAME }}
          path: dist/${{ env.EXE_NAME }}

      - name: Publish release
        if: env.VERSION != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.VERSION }}
          files: dist/${{ env.EXE_NAME }}
          generate_release_notes: true
